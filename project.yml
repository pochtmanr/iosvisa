name: VisaPassage
options:
  bundleIdPrefix: com.visapassage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    # DEVELOPMENT_TEAM is supplied by the git-ignored Secrets.xcconfig so the
    # real Team ID is not committed. (An empty value here would override it.)
    CODE_SIGN_STYLE: Automatic

# Public, non-secret build settings live in Base.xcconfig.
# Real Supabase keys live in the git-ignored Secrets.xcconfig
# (copy Secrets.xcconfig.example → Secrets.xcconfig).
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  VisaPassage:
    type: application
    platform: iOS
    sources:
      - path: VisaPassage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.visapassage.app
        INFOPLIST_FILE: VisaPassage/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: VisaPassage/VisaPassage.entitlements
        # Surface the xcconfig values into Info.plist substitution.
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        GOOGLE_IOS_CLIENT_ID: $(GOOGLE_IOS_CLIENT_ID)
        GOOGLE_REVERSED_CLIENT_ID: $(GOOGLE_REVERSED_CLIENT_ID)
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift

  VisaPassageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VisaPassageTests
    dependencies:
      - target: VisaPassage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.visapassage.app.tests
        GENERATE_INFOPLIST_FILE: YES

  VisaPassageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VisaPassageUITests
    dependencies:
      - target: VisaPassage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.visapassage.app.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VisaPassage:
    build:
      targets:
        VisaPassage: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VisaPassageTests
        - VisaPassageUITests
